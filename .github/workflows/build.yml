name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          # Publish only from main, and only once per version number.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] \
             && ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION hasn't been released yet; it will be published."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RENEWLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/renewly.jks"
            echo "RENEWLY_KEYSTORE_PATH=$RUNNER_TEMP/renewly.jks" >> "$GITHUB_ENV"
            echo "Release key found."
          else
            echo "No private key secret set. Using the committed public build key."
          fi

      - name: Test and build
        env:
          RENEWLY_VERSION_CODE: ${{ github.run_number }}
          RENEWLY_VERSION_NAME: ${{ steps.version.outputs.name }}
          RENEWLY_KEYSTORE_PASSWORD: ${{ secrets.RENEWLY_KEYSTORE_PASSWORD }}
          RENEWLY_KEY_ALIAS: ${{ secrets.RENEWLY_KEY_ALIAS }}
          RENEWLY_KEY_PASSWORD: ${{ secrets.RENEWLY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Renewly-${{ steps.version.outputs.name }}.apk"

      - name: Check there is no internet permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions dist/*.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK asks for internet access, but Renewly must stay offline."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Renewly-${{ steps.version.outputs.name }}
          path: dist/*.apk

      - name: Release notes
        if: steps.version.outputs.publish == 'true'
        run: |
          VERSION=${{ steps.version.outputs.name }}
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          printf '\n**Install:** download the APK below on your Android phone and open it. See the README for Samsung tips.\n' >> notes.md
          cat notes.md

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Renewly ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*.apk
          make_latest: true
