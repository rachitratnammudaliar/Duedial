name: Duedial
options:
  bundleIdPrefix: com.rachitratnammudaliar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Duedial:
    type: application
    platform: iOS
    sources: [Duedial]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rachitratnammudaliar.duedial
        PRODUCT_NAME: Duedial
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Duedial
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  DuedialTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DuedialTests]
    dependencies:
      - target: Duedial
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rachitratnammudaliar.duedial.tests
schemes:
  Duedial:
    build:
      targets:
        Duedial: all
        DuedialTests: [test]
    test:
      targets: [DuedialTests]
